name: sarari
options:
  bundleIdPrefix: com.kenta3578
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    # サプライチェーン: 実際に使う revision は Git 追跡している
    # sarari.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved で固定される。
    # 依存を上げるときは -resolvePackageDependencies し直して同ファイルをコミットすること。
    from: "0.9.0"
  # WhisperKit が使っている取得ライブラリ（同梱済み）。トークナイザを**解析せずに**取得するために
  # 直接使う（Issue #106。読み込みは照合のあと）。版の幅は WhisperKit の指定（upToNextMinor）に合わせる。
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    minorVersion: "1.1.6"

targets:
  sarari:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - sarariTests
    sources:
      - path: Sources
      # sarari の開始音・停止音（Issue #2）。scripts/make-sounds.py が作る。
      # フォルダ参照なので Contents/Resources/Sounds/ にそのまま入る。
      - path: Resources/Sounds
        type: folder
        buildPhase: resources
      # アプリアイコン（Issue #97）。原本は Resources/AppIcon.svg、scripts/make-icon.sh が書き出す。
      - path: Resources/Assets.xcassets
    dependencies:
      - package: WhisperKit
      - package: swift-transformers
        product: Hub
    settings:
      base:
        PRODUCT_NAME: sarari
        PRODUCT_BUNDLE_IDENTIFIER: com.kenta3578.koebun
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        # 言語モードは Swift 5 のまま、データ競合の検査だけ最大にする（Issue #103）。
        # 型で競合を防げているかをコンパイラに確かめさせる唯一の手段。
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # sandbox OFF（Accessibility / CGEvent / グローバル監視のため必須）
        ENABLE_APP_SANDBOX: NO
        # Hardened Runtime は配布版もローカル版も有効（Issue #103）。アクセシビリティとマイクの
        # 許可を持つアプリなので、他のプログラムに入り込まれないようにする。
        # scripts/ の codesign でも同じ entitlements と --options runtime を渡している。
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/sarari.entitlements
        # 署名は Xcode で開いた時に各自の Personal Team を割り当てる
        CODE_SIGN_STYLE: Automatic

  # E2E テストの挿入先（Issue #126）。sarari 本体には入らない。テキスト欄とパスワード欄を持ち、
  # 欄の中身をファイルへ書き出す。sarari と別のプロセスにするのは、挿入先を AX で読むときに
  # 自分自身へ問い合わせて固まらないため。
  sarariE2EHost:
    type: application
    platform: macOS
    sources:
      - path: E2EHost
    settings:
      base:
        PRODUCT_NAME: sarariE2EHost
        PRODUCT_BUNDLE_IDENTIFIER: com.kenta3578.sarariE2EHost
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic

  # 単体テスト（Issue #102）。アプリを TEST_HOST にして同じモジュールとして見る
  # （守備範囲とホスト側の起動抑止は Tests/README.md）。
  # TEST_HOST / BUNDLE_LOADER は xcodegen がアプリ依存から自動で埋める。
  sarariTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - README.md
    dependencies:
      - target: sarari
    # E2E の挿入先（sarariE2EHost）は依存に入れない。sarari-e2e スキームだけが同じ出力先に並べて作る
    # （ふだんの `xcodebuild test` と CI で作らない。Issue #126）。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenta3578.koebunTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

# 説明書の画面画像を描き出す専用のスキーム（Issue #56。scripts/docs-shots.sh が使う）。
# 設定値は UserDefaults にあり仮のホームでは切り替わらないので、既定値を起動引数で渡す。
# 引数の層は保存値より優先して読まれ、書き込まれないので、使っている人の設定は変わらない。
schemes:
  sarari-docshots:
    build:
      targets:
        sarari: all
        sarariTests: [test]
    test:
      targets:
        - sarariTests
      # 数値・真偽・配列は XML の plist で書く（"30" のように書くと文字列になり、型が合わずに読み飛ばされる）。
      # 追加キーは「無し」を表せないので、型の合わない値を置いて保存値を隠す。
      commandLineArguments:
        "-startSound Glass": true
        "-stopSound Basso": true
        "-hudSize minimal": true
        "-hudPosition bottomCenter": true
        "-edgeGlowEnabled <true/>": true
        "-resultRetention hud": true
        "-hotKeyModifierCodes <array><integer>61</integer></array>": true
        "-hotKeyExtraKeyCode none": true
        "-historyRetentionDays <integer>30</integer>": true
        "-fillerRemovalEnabled <true/>": true
        "-ignoredRuleSuggestions <array/>": true
        "-speechEngine apple": true

  # E2E テスト（Issue #126。scripts/e2e.sh が使う）。設定値は sarari-docshots と同じ考え方で
  # 起動引数から渡し、使っている人の保存値を読まない・書かない。
  sarari-e2e:
    build:
      targets:
        sarari: all
        sarariTests: [test]
        sarariE2EHost: [test]
    test:
      targets:
        - sarariTests
      commandLineArguments:
        "-startSound なし": true
        "-stopSound なし": true
        "-hudSize minimal": true
        "-hudPosition bottomCenter": true
        "-edgeGlowEnabled <false/>": true
        "-resultRetention hud": true
        "-hotKeyModifierCodes <array><integer>61</integer></array>": true
        "-hotKeyExtraKeyCode none": true
        "-historyRetentionDays <integer>30</integer>": true
        "-fillerRemovalEnabled <true/>": true
        "-ignoredRuleSuggestions <array/>": true
        "-speechEngine apple": true
